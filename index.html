<!doctype html>
<meta charset="utf-8">
<title>Palworld Live Map</title>
<link rel="stylesheet" href="vendor/leaflet.css">
<style>
  :root { --bg:#0b0e13; --panel:rgba(14,18,25,.92); --line:#2a323d; --fg:#e6edf3;
          --dim:#8b98a5; --me:#4ade80; --other:#60a5fa; --warn:#f87171; --acc:#2b8f57; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
              font:13px/1.45 system-ui,-apple-system,Segoe UI,sans-serif;
              overflow:hidden; user-select:none; }
  #map { position:absolute; inset:0; background:#080a0e; }
  .leaflet-container { background:#080a0e; outline:none; font:inherit; }

  #hud { position:absolute; top:8px; left:8px; right:8px; z-index:600;
         background:var(--panel); border:1px solid var(--line); border-radius:9px;
         backdrop-filter:blur(9px); }
  #bar { display:flex; align-items:center; gap:6px; padding:7px 9px; flex-wrap:wrap; }
  #bar > * { flex:none; }
  #bar b { font-size:12px; }
  #dot { width:8px; height:8px; border-radius:50%; background:var(--warn); flex:none; }
  #dot.ok { background:var(--me); }
  .sp { margin-left:auto; }
  button { background:#1a212d; color:var(--fg); border:1px solid var(--line);
           border-radius:6px; padding:3px 8px; font-size:11.5px; cursor:pointer; }
  button:hover { background:#222b3a; }
  button.on { background:var(--acc); border-color:#37a869; }
  .seg { display:flex; gap:0; }
  .seg button { border-radius:0; }
  .seg button:first-child { border-radius:6px 0 0 6px; }
  .seg button:last-child { border-radius:0 6px 6px 0; border-left:none; }

  #panels { display:none; padding:0 9px 9px; max-height:52vh; overflow:auto; }
  #panels.show { display:block; }
  #search { width:100%; background:#111823; color:var(--fg); border:1px solid var(--line);
            border-radius:6px; padding:5px 8px; font-size:12px; margin-bottom:7px; }
  details { border-top:1px solid var(--line); }
  summary { cursor:pointer; padding:5px 2px; font-size:12px; display:flex;
            align-items:center; gap:6px; }
  summary::-webkit-details-marker { display:none; }
  summary b { font-weight:600; }
  summary .n { color:var(--dim); font-size:11px; margin-left:auto; }
  .types { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; padding:2px 0 6px; }
  label.t { display:flex; align-items:center; gap:5px; font-size:11.5px;
            color:var(--dim); cursor:pointer; overflow:hidden; }
  label.t input { accent-color:var(--acc); margin:0; flex:none; }
  label.t span { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  label.t.on { color:var(--fg); }
  label.t i { color:#5b6675; font-size:10.5px; flex:none; }

  #foot { display:flex; align-items:center; gap:7px; padding:6px 9px;
          border-top:1px solid var(--line); font-size:11.5px; color:var(--dim); }
  #plist { display:flex; gap:9px; flex-wrap:wrap; }
  .p { display:flex; align-items:center; gap:4px; }
  .p i { width:7px; height:7px; border-radius:50%; flex:none; }
  input[type=range] { width:70px; }

  .me-marker,.other-marker { border-radius:50%; border:2px solid #05070a; }
  .me-marker { background:var(--me); box-shadow:0 0 0 2px rgba(74,222,128,.35); }
  .other-marker { background:var(--other); }
  #hint { position:absolute; bottom:6px; left:8px; z-index:600;
          font-size:10.5px; color:#67717f; }

  #close { padding:2px 7px; font-size:14px; line-height:1; color:var(--dim); }
  #close:hover { background:#6f2020; border-color:#8f2b2b; color:var(--fg); }
  body.mini #close { display:inline-block; }
  #nav, #status { display:flex; align-items:center; gap:9px; padding:5px 9px;
                  border-top:1px solid var(--line); font-size:11.5px; }
  #status { font-size:11px; color:var(--dim); }
  .kv { display:flex; align-items:center; gap:4px; white-space:nowrap; }
  .kv b { color:var(--fg); font-weight:600; }
  .kv.dimmed { color:var(--dim); }
  .arrow { color:var(--me); font-size:13px; line-height:1; }
  .wp-dot { width:11px; height:11px; border-radius:50%; background:#fbbf24;
            border:2px solid #05070a; box-shadow:0 0 0 2px rgba(251,191,36,.35); }
  summary input[type=checkbox], .grow input[type=checkbox] { accent-color:var(--acc); margin:0; }
  .grow { border-top:1px solid var(--line); }
  .grow label { display:flex; align-items:center; gap:6px; padding:5px 2px;
                font-size:12px; color:var(--dim); cursor:pointer; }
  .grow label.on { color:var(--fg); }
  .grow label .n { margin-left:auto; color:var(--dim); font-size:11px; }
  #grip { position:absolute; right:0; bottom:0; width:20px; height:20px; z-index:700;
          cursor:nwse-resize; opacity:.55;
          background:linear-gradient(135deg, transparent 0 52%, var(--dim) 52% 60%,
                     transparent 60% 70%, var(--dim) 70% 78%, transparent 78%); }
  #grip:hover { opacity:1; }
  #scale { position:absolute; left:10px; bottom:24px; z-index:600;
           font:10.5px ui-monospace,monospace; color:#c6d0da; pointer-events:none;
           text-shadow:0 1px 2px #000; }
  #scale div { border:1px solid #c6d0da; border-top:none; height:5px; }
  body.mini #panels, body.mini #status, body.mini #foot, body.mini #hint { display:none !important; }
  body.mini #bar b, body.mini .seg, body.mini #layers, body.mini #fit { display:none; }
</style>

<div id="map"></div>

<div id="hud">
  <div id="bar">
    <span id="dot"></span><b>Palworld Live Map</b>
    <span class="seg">
      <button id="mAuto" class="on" title="Follow whichever map you are on">Auto</button>
      <button id="mDef">Palpagos</button>
      <button id="mTree">World Tree</button>
    </span>
    <span class="sp"></span>
    <button id="follow" class="on" title="Keep the view centred on you">Follow</button>
    <button id="fit" title="Zoom out to the whole map">Fit</button>
    <button id="layers">Layers</button>
    <button id="mini" title="Compact minimap mode">Mini</button>
    <span id="age" style="color:var(--dim);font-size:11px;min-width:34px;text-align:right">--</span>
    <button id="close" title="Close the overlay (reopen with Meta+P or the server app)">&times;</button>
  </div>

  <div id="panels">
    <input id="search" placeholder="Filter types… (e.g. dungeon, chest, alpha)">
    <div style="display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap">
      <button id="pDg">Dungeons only</button>
      <button id="pNone">Clear all</button>
      <button id="collected">Collected: hide</button>
      <button id="autoCol">Auto-mark: off</button>
      <button id="pReset" class="warn">Reset collected</button>
    </div>
    <div id="groups"></div>
  </div>

  <div id="nav">
    <span class="kv" id="wpBox" style="display:none">
      <span class="arrow" id="wpArrow">↑</span>
      <span>Waypoint <b id="wpDist">--</b> <span id="wpDir" class="kv dimmed"></span></span>
      <button id="wpClear" title="Clear waypoint">&times;</button>
    </span>
    <span class="kv" id="nearBox">
      <span class="arrow" id="nearArrow">↑</span>
      <span id="nearName" class="dimmed">nearest --</span>
      <b id="nearDist">--</b>
    </span>
    <span class="kv" id="offmap" style="display:none;color:var(--warn)"
          title="Your coordinates are not inside any known map - usually a loading screen or an unmapped instance">off-map</span>
    <span class="sp"></span>
    <span class="kv dimmed" id="coords" title="Raw world coordinates">--</span>
  </div>

  <div id="status">
    <span class="kv">Day <b id="stDay">--</b></span>
    <span class="kv"><b id="stPlayers">--</b> online</span>
    <span class="kv"><b id="stCamps">--</b> camps</span>
    <span class="kv" id="stFpsBox"><b id="stFps">--</b> fps</span>
    <span class="sp"></span>
    <span class="kv dimmed" id="stName">--</span>
  </div>

  <div id="foot">
    <div id="plist"></div>
    <span class="sp"></span>
    <span id="mapname" style="color:var(--dim)"></span>
    <input type="range" id="op" min="30" max="100" value="100" title="Opacity">
  </div>
</div>
<div id="grip" title="Drag to resize"></div>
<div id="scale"><span id="scaleTxt">--</span><div id="scaleBar" style="width:80px"></div></div>
<div id="hint">Alt + right-drag to move · drag the corner to resize · Shift + click for a waypoint · click a marker to mark it collected</div>

<script src="vendor/leaflet.js"></script>
<script>
const $ = id => document.getElementById(id);
const post = m => window.webkit?.messageHandlers?.overlay?.postMessage(JSON.stringify(m));
const LS = "pwlm.v2";
const saved = (() => { try { return JSON.parse(localStorage.getItem(LS)) || {}; } catch { return {}; } })();
const prefs = Object.assign({ mapMode: "auto", enabled: null, follow: true,
                             opacity: 100, waypoint: null, mini: false,
                             layersOpen: false, collected: [], collectedMode: "hide",
                             autoCollect: false }, saved);
const savePrefs = () => localStorage.setItem(LS, JSON.stringify(prefs));

let MAPS = {}, FILTERS = [], NODES = {}, TYPEMETA = {};
let map = null, curMap = null, me = null, lastPlayers = [], switching = false;
const markerLayers = new Map();     // type -> layer
let playerLayer = null, playerMarks = new Map();
const canvasRenderer = () => L.canvas({ padding: 0.4 });

// ---- default enabled set: the dungeon family -----------------------------
const DEFAULT_ON = ["dungeon_random", "dungeon_sealed", "dimensional_rift"];
const DEFAULT_ZOOM = 3;
const MINI_ZOOM = 4;

// Raw game units are centimetres, and on these maps +x is north, +y is east.
const dist2d = (ax, ay, bx, by) => Math.hypot(bx - ax, by - ay);
const fmtDist = u => u >= 100000 ? (u / 100000).toFixed(2) + " km"
                   : u >= 100 ? Math.round(u / 100) + " m"
                   : Math.round(u) + " cm";
const COMPASS = ["N","NE","E","SE","S","SW","W","NW"];
function bearing(ax, ay, bx, by) {          // degrees, 0 = north, 90 = east
  const d = Math.atan2(by - ay, bx - ax) * 180 / Math.PI;
  return (d + 360) % 360;
}
const compass8 = deg => COMPASS[Math.round(deg / 45) % 8];
function fmtUptime(sec) {
  if (!sec && sec !== 0) return "--";
  const d = Math.floor(sec / 86400), h = Math.floor(sec % 86400 / 3600),
        m = Math.floor(sec % 3600 / 60);
  return d ? `${d}d ${h}h` : h ? `${h}h ${m}m` : `${m}m`;
}
function fitAll() { if (map && curMap) map.fitBounds(MAPS[curMap].bounds); }
let enabled = new Set(prefs.enabled || DEFAULT_ON);

// ---- collected markers ---------------------------------------------------
// The server cannot tell us what you have picked up: the save records obtained
// relics as opaque GUIDs with no coordinates, and those GUIDs appear nowhere in
// Level.sav, so there is no join to a map position. Only the game client knows.
// So we track it ourselves, keyed on type + rounded position.
let collected = new Set(prefs.collected || []);
// Exact stored coordinates, not rounded: the same JSON supplies both the
// render and the click, so string equality is exact and there are no
// half-value rounding edge cases.
const ckey = (type, p) => `${type}@${p[0]},${p[1]}`;
// one-time pickups worth auto-marking when you walk over them
const AUTO_TYPES = /^(lifmunk_effigy|effigy_|kinship_peach|skill_fruit|note$|treasure_box|treasure_map)/;
const AUTO_RADIUS = 1500;   // 15 m in raw units

function saveCollected() { prefs.collected = [...collected]; savePrefs(); }

function toggleCollected(type, p) {
  const k = ckey(type, p);
  collected.has(k) ? collected.delete(k) : collected.add(k);
  saveCollected();
  renderTypes();
  updateCollectedBtn();
}

function updateCollectedBtn() {
  const b = $("collected");
  if (!b) return;
  const mode = prefs.collectedMode;
  b.textContent = `Collected: ${mode}`;
  b.classList.toggle("on", mode !== "show");
  b.title = `${collected.size} marked collected · click to cycle show / fade / hide`;
}

// ---- exact CRS from TH.GL's published per-map transformation --------------
async function ensureNodes(id) {
  if (NODES[id]) return NODES[id];
  NODES[id] = await (await fetch(`data/nodes.${id}.json`)).json();
  return NODES[id];
}

function crsFor(m) {
  const t = m.transformation;
  return L.extend({}, L.CRS.Simple, {
    transformation: new L.Transformation(t[0], t[1], t[2], t[3]),
  });
}

function inBounds(m, x, y) {
  const [[laMin, lnMin], [laMax, lnMax]] = m.bounds;
  return x >= laMin && x <= laMax && y >= lnMin && y <= lnMax;
}

// player raw (location_x, location_y) -> latlng in the map's own frame
const toLatLng = (x, y) => L.latLng(x, y);

function spriteIcon(meta, px) {
  const ic = meta && meta.icon;
  if (!ic) {
    return L.divIcon({ className: "", iconSize: [8, 8],
      html: `<div style="width:8px;height:8px;border-radius:50%;background:#94a3b8;opacity:.9"></div>` });
  }
  const s = px / ic.width;
  return L.divIcon({
    className: "", iconSize: [px, px], iconAnchor: [px / 2, px / 2],
    html: `<div style="width:${px}px;height:${px}px;position:relative;overflow:hidden">
      <div style="position:absolute;width:${ic.width}px;height:${ic.height}px;
        background:url(data/icons.webp) -${ic.x}px -${ic.y}px;
        transform:scale(${s});transform-origin:0 0"></div></div>`,
  });
}

// ---- map lifecycle -------------------------------------------------------
async function buildMap(id) {
  await ensureNodes(id);
  if (map) { map.remove(); map = null; markerLayers.clear(); playerMarks.clear(); }
  const m = MAPS[id];
  curMap = id;
  $("mapname").textContent = m.label;

  map = L.map("map", {
    crs: crsFor(m), zoomControl: false, attributionControl: false,
    minZoom: m.minZoom, maxZoom: m.maxZoom, zoom: 0,
    center: L.latLng((m.bounds[0][0] + m.bounds[1][0]) / 2,
                     (m.bounds[0][1] + m.bounds[1][1]) / 2),
    preferCanvas: true, zoomSnap: 0.25, wheelPxPerZoomLevel: 90,
  });
  L.control.zoom({ position: "bottomright" }).addTo(map);
  L.tileLayer(m.tileUrl, {
    tileSize: m.tileSize, minNativeZoom: m.minNativeZoom,
    maxNativeZoom: m.maxNativeZoom, minZoom: m.minZoom, maxZoom: m.maxZoom,
    bounds: m.bounds, noWrap: true, keepBuffer: 2,
  }).addTo(map);
  fitAll();
  // opening zoomed on the player is what an overlay is actually for; the whole
  // island only wastes screen while you are running around one corner of it
  const mine = lastPlayers.find(p => p.name === me);
  if (mine && inBounds(m, mine.location_x, mine.location_y))
    map.setView(toLatLng(mine.location_x, mine.location_y), DEFAULT_ZOOM);
  const pad = (m.bounds[1][0] - m.bounds[0][0]) * 0.05;
  map.setMaxBounds([[m.bounds[0][0] - pad, m.bounds[0][1] - pad],
                    [m.bounds[1][0] + pad, m.bounds[1][1] + pad]]);
  playerLayer = L.layerGroup().addTo(map);
  wpLayer = L.layerGroup().addTo(map);
  drawWaypoint();
  map.on("zoomend moveend", updateScale);
  map.on("click", ev => {
    if (!ev.originalEvent.shiftKey) return;
    setWaypoint(ev.latlng.lat, ev.latlng.lng);   // lat = x, lng = y
  });
  updateScale();
  renderTypes();
  drawPlayers(lastPlayers, true);
}

function typeCount(id) { return (NODES[curMap]?.types?.[id] || []).length; }

function renderTypes() {
  for (const [t, l] of markerLayers) { map.removeLayer(l); }
  markerLayers.clear();
  const types = NODES[curMap]?.types || {};
  const rend = canvasRenderer();
  for (const t of enabled) {
    const pts = types[t];
    if (!pts || !pts.length) continue;
    const meta = TYPEMETA[t];
    const big = pts.length > 200;
    const layer = L.layerGroup();
    for (const p of pts) {
      const done = collected.has(ckey(t, p));
      if (done && prefs.collectedMode === "hide") continue;
      const dim = done && prefs.collectedMode === "fade";
      const ll = toLatLng(p[0], p[1]);
      const mk = big
        ? L.circleMarker(ll, { renderer: rend, radius: 3, weight: 1,
            color: "#0b0e13", fillColor: "#f0b429", fillOpacity: dim ? .25 : .95 })
        : L.marker(ll, { opacity: dim ? .3 : 1,
            icon: spriteIcon(meta, Math.round(13 * (meta?.size || 1))) });
      mk.bindTooltip(`${meta?.label || t}${done ? " · collected" : ""}`, { direction: "top" });
      mk.on("click", () => toggleCollected(t, p));
      layer.addLayer(mk);
    }
    layer.addTo(map);
    markerLayers.set(t, layer);
  }
}

// ---- waypoint ------------------------------------------------------------
let wpLayer = null, wpMarker = null, wpLine = null;

function drawWaypoint() {
  if (!wpLayer) return;
  wpLayer.clearLayers();
  wpMarker = wpLine = null;
  const w = prefs.waypoint;
  $("wpBox").style.display = w && w.map === curMap ? "" : "none";
  if (!w || w.map !== curMap) return;
  wpMarker = L.marker(toLatLng(w.x, w.y), { icon: L.divIcon({
    className: "", iconSize: [11, 11], iconAnchor: [5.5, 5.5],
    html: '<div class="wp-dot"></div>' }) })
    .bindTooltip("Waypoint", { direction: "top", offset: [0, -7] });
  wpLayer.addLayer(wpMarker);
  wpLine = L.polyline([], { color: "#fbbf24", weight: 1.5,
                            dashArray: "5 5", opacity: .75 });
  wpLayer.addLayer(wpLine);
}

function setWaypoint(x, y) {
  prefs.waypoint = { map: curMap, x, y };
  savePrefs();
  drawWaypoint();
}

// ---- nearest enabled point of interest -----------------------------------
function nearestPoi(px, py) {
  const types = NODES[curMap]?.types || {};
  let best = null;
  for (const t of enabled) {
    const pts = types[t];
    if (!pts) continue;
    for (const q of pts) {
      if (collected.has(ckey(t, q))) continue;
      const d = dist2d(px, py, q[0], q[1]);
      if (!best || d < best.d) best = { d, x: q[0], y: q[1], type: t };
    }
  }
  return best;
}

// Distance to the nearest mapped feature of any type. The drawn map ends well
// inside the tile bounds, so this is what distinguishes "out past the edge of
// the map" from "somewhere the map simply has nothing marked".
const OFFMAP_UNITS = 120000;      // 1.2 km
function nearestAny(px, py) {
  const types = NODES[curMap]?.types || {};
  let best = Infinity;
  for (const pts of Object.values(types))
    for (const q of pts) {
      const d = dist2d(px, py, q[0], q[1]);
      if (d < best) best = d;
    }
  return best;
}

// ---- scale bar -----------------------------------------------------------
function updateScale() {
  if (!map) return;
  const a = map.containerPointToLatLng([0, 0]);
  const b = map.containerPointToLatLng([80, 0]);
  const units = Math.abs(b.lng - a.lng);       // lng is the +y / east axis
  $("scaleTxt").textContent = fmtDist(units);
}

// ---- live players --------------------------------------------------------
function drawPlayers(players, force) {
  if (!map) return;
  const seen = new Set();
  for (const p of players) {
    if (!inBounds(MAPS[curMap], p.location_x, p.location_y)) continue;
    const isMe = p.name === me;
    const ll = toLatLng(p.location_x, p.location_y);
    seen.add(p.name);
    let mk = playerMarks.get(p.name);
    if (!mk) {
      const s = isMe ? 16 : 12;
      mk = L.marker(ll, { zIndexOffset: isMe ? 1000 : 500, icon: L.divIcon({
        className: "", iconSize: [s, s], iconAnchor: [s / 2, s / 2],
        html: `<div class="${isMe ? "me-marker" : "other-marker"}"
                 style="width:${s}px;height:${s}px"></div>` }) })
        .bindTooltip(p.name, { direction: "top", offset: [0, -7] }).addTo(playerLayer);
      playerMarks.set(p.name, mk);
    } else mk.setLatLng(ll);
    if (isMe && prefs.follow) {
      if (map.getZoom() < DEFAULT_ZOOM) map.setView(ll, DEFAULT_ZOOM);
      else map.panTo(ll, { animate: !force, duration: .35 });
    }
  }
  for (const [n, mk] of playerMarks)
    if (!seen.has(n)) { playerLayer.removeLayer(mk); playerMarks.delete(n); }
}

function mapForPlayer(p) {
  if (!p) return null;
  let best = null;
  for (const id in MAPS) {
    if (!inBounds(MAPS[id], p.location_x, p.location_y)) continue;
    if (!best || MAPS[id].area < MAPS[best].area) best = id;
  }
  return best;                 // smallest containing map = the instance you are in
}
const isOverworld = id => id === "default" || id === "tree";

async function tick() {
  let d;
  try { d = await (await fetch("/api/players")).json(); }
  catch { $("dot").classList.remove("ok"); return; }
  me = d.me;
  lastPlayers = d.players || [];
  $("dot").classList.toggle("ok", !d.error);
  $("age").textContent = d.error ? "offline"
    : d.ts ? `${Math.max(0, Date.now() / 1000 - d.ts).toFixed(1)}s` : "--";

  const mine = lastPlayers.find(p => p.name === me);
  const where = mapForPlayer(mine);
  if (prefs.mapMode === "auto" && where && where !== curMap && !switching) {
    switching = true;
    try { await buildMap(where); } finally { switching = false; }
  }
  drawPlayers(lastPlayers);

  updateNav(mine, where);

  $("plist").innerHTML = lastPlayers.map(p => {
    const on = inBounds(MAPS[curMap], p.location_x, p.location_y);
    return `<span class="p"><i style="background:${p.name === me ? "var(--me)" : "var(--other)"};
      opacity:${on ? 1 : .35}"></i>${p.name} <span style="color:var(--dim)">Lv${p.level}</span></span>`;
  }).join("") || '<span style="color:var(--dim)">nobody online</span>';
}

function autoCollectNear(px, py) {
  if (!prefs.autoCollect) return;
  const types = NODES[curMap]?.types || {};
  let changed = false;
  for (const t of enabled) {
    if (!AUTO_TYPES.test(t)) continue;
    for (const q of (types[t] || [])) {
      if (Math.abs(q[0] - px) > AUTO_RADIUS || Math.abs(q[1] - py) > AUTO_RADIUS) continue;
      if (dist2d(px, py, q[0], q[1]) > AUTO_RADIUS) continue;
      const k = ckey(t, q);
      if (!collected.has(k)) { collected.add(k); changed = true; }
    }
  }
  if (changed) { saveCollected(); renderTypes(); updateCollectedBtn(); }
}

function updateNav(mine, where) {
  const has = mine && inBounds(MAPS[curMap], mine.location_x, mine.location_y);
  $("coords").textContent = has
    ? `${Math.round(mine.location_x)}, ${Math.round(mine.location_y)}` : "--";

  // waypoint distance + heading
  const w = prefs.waypoint;
  if (has && w && w.map === curMap) {
    const d = dist2d(mine.location_x, mine.location_y, w.x, w.y);
    const b = bearing(mine.location_x, mine.location_y, w.x, w.y);
    $("wpDist").textContent = fmtDist(d);
    $("wpDir").textContent = compass8(b);
    $("wpArrow").style.transform = `rotate(${b}deg)`;
    if (wpLine) wpLine.setLatLngs([toLatLng(mine.location_x, mine.location_y),
                                   toLatLng(w.x, w.y)]);
  }

  // Badge state is recomputed from scratch every tick - three cases only.
  const badge = $("offmap");
  if (!mine) {
    badge.style.display = "none";
  } else if (!where) {
    badge.style.display = "";
    badge.textContent = "off-map";
    badge.title = "These coordinates are not inside any of the 164 known maps - "
                + "usually a loading screen or an unmapped instance.";
  } else {
    const far = has ? nearestAny(mine.location_x, mine.location_y) : Infinity;
    if (has && far > OFFMAP_UNITS) {
      badge.style.display = "";
      badge.textContent = `off the drawn map · ${fmtDist(far)} to nearest feature`;
      badge.title = "The map tiles end here. Your position is correct; there is "
                  + "simply nothing drawn this far out.";
    } else {
      badge.style.display = "none";
    }
  }

  // nearest enabled marker
  if (has) autoCollectNear(mine.location_x, mine.location_y);

  const n = has ? nearestPoi(mine.location_x, mine.location_y) : null;
  if (n) {
    const b = bearing(mine.location_x, mine.location_y, n.x, n.y);
    $("nearName").textContent = TYPEMETA[n.type]?.label || n.type;
    $("nearDist").textContent = fmtDist(n.d);
    $("nearArrow").style.transform = `rotate(${b}deg)`;
    $("nearBox").style.display = "";
    $("nearBox").onclick = () => { prefs.follow = false; savePrefs();
      $("follow").classList.remove("on"); map.setView(toLatLng(n.x, n.y), Math.max(map.getZoom(), 4)); };
  } else {
    $("nearBox").style.display = "none";
  }
}

async function tickStatus() {
  let d;
  try { d = await (await fetch("/api/status")).json(); } catch { return; }
  const m = d.metrics, i = d.info;
  if (m) {
    $("stDay").textContent = m.days ?? "--";
    $("stPlayers").textContent = `${m.currentplayernum}/${m.maxplayernum}`;
    $("stCamps").textContent = m.basecampnum ?? "--";
    $("stFps").textContent = Math.round(m.serverfps ?? 0);
    $("stFpsBox").title = `avg ${(m.serverfpsaverage ?? 0).toFixed(1)} fps, `
      + `frame ${(m.serverframetime ?? 0).toFixed(1)} ms, up ${fmtUptime(m.uptime)}`;
  }
  if (i) $("stName").textContent = `${i.servername} · ${i.version}`;

  // Never present a cached reading as if it were current: when the poller is
  // erroring the numbers below are the last ones we saw, not live ones.
  const stale = !!d.error;
  $("status").style.opacity = stale ? "0.45" : "1";
  if (stale) $("stName").textContent = "server unreachable · last known values";
}

// ---- layers UI ----------------------------------------------------------
// Groups where per-type toggles are meaningless - every member is a single
// unique spawn, so you either want the whole set on the map or none of it.
const ATOMIC_GROUPS = new Set(["pal_npc"]);

function setGroupEnabled(vals, on) {
  for (const v of vals) on ? enabled.add(v.id) : enabled.delete(v.id);
  prefs.enabled = [...enabled];
  savePrefs();
  renderTypes();
  buildGroups();
}

function buildGroups() {
  const host = $("groups");
  host.innerHTML = "";
  const q = $("search").value.trim().toLowerCase();
  for (const g of FILTERS) {
    const vals = g.values.filter(v => typeCount(v.id) > 0 &&
      (!q || v.label.toLowerCase().includes(q) || v.id.toLowerCase().includes(q)));
    if (!vals.length) continue;
    const nOn = vals.filter(v => enabled.has(v.id)).length;
    const allOn = nOn === vals.length, someOn = nOn > 0 && !allOn;
    const spawns = vals.reduce((a, v) => a + typeCount(v.id), 0);

    // all-or-nothing: one switch, no child list
    if (ATOMIC_GROUPS.has(g.group)) {
      const row = document.createElement("div");
      row.className = "grow";
      row.innerHTML = `<label class="${allOn ? "on" : ""}">
        <input type="checkbox" ${allOn ? "checked" : ""}>
        <b>${g.label}</b><span class="n">${spawns}</span></label>`;
      const box = row.querySelector("input");
      box.indeterminate = someOn;
      box.onchange = e => setGroupEnabled(vals, e.target.checked);
      host.appendChild(row);
      continue;
    }

    const det = document.createElement("details");
    if (q || g.group === "locations") det.open = true;
    det.innerHTML = `<summary><input type="checkbox" ${allOn ? "checked" : ""}><b>${g.label}</b>
      <span class="n">${nOn ? nOn + " on / " : ""}${vals.length}</span></summary>`;
    const master = det.querySelector("summary input");
    master.indeterminate = someOn;
    // don't let the checkbox open/close the <details>
    master.onclick = e => e.stopPropagation();
    master.onchange = e => setGroupEnabled(vals, e.target.checked);
    const wrap = document.createElement("div");
    wrap.className = "types";
    for (const v of vals) {
      const l = document.createElement("label");
      l.className = "t" + (enabled.has(v.id) ? " on" : "");
      l.innerHTML = `<input type="checkbox" ${enabled.has(v.id) ? "checked" : ""}>
        <span>${v.label}</span><i>${typeCount(v.id)}</i>`;
      l.querySelector("input").onchange = e => {
        e.target.checked ? enabled.add(v.id) : enabled.delete(v.id);
        l.classList.toggle("on", e.target.checked);
        prefs.enabled = [...enabled]; savePrefs();
        renderTypes(); buildGroups();
      };
      wrap.appendChild(l);
    }
    det.appendChild(wrap);
    host.appendChild(det);
  }
}

// ---- controls -----------------------------------------------------------
async function setMode(m) {
  prefs.mapMode = m; savePrefs();
  $("mAuto").classList.toggle("on", m === "auto");
  $("mDef").classList.toggle("on", m === "default");
  $("mTree").classList.toggle("on", m === "tree");
  if (m === "default" || m === "tree") {
    if (curMap !== m) await buildMap(m);
  } else {
    const w = mapForPlayer(lastPlayers.find(p => p.name === me));
    if (w && w !== curMap) await buildMap(w);
  }
}
$("mAuto").onclick = () => setMode("auto");
$("mDef").onclick  = () => setMode("default");
$("mTree").onclick = () => setMode("tree");
$("follow").onclick = e => { prefs.follow = !prefs.follow; savePrefs();
  e.target.classList.toggle("on", prefs.follow); };
$("fit").onclick = () => { prefs.follow = false; savePrefs();
  $("follow").classList.remove("on"); fitAll(); };
$("wpClear").onclick = () => { prefs.waypoint = null; savePrefs(); drawWaypoint(); };
$("mini").onclick = () => setMini(!prefs.mini);
$("close").onclick = () => post({ action: "quit" });
function setMini(on) {
  prefs.mini = on; savePrefs();
  document.body.classList.toggle("mini", on);
  $("mini").classList.toggle("on", on);
  if (on) {
    $("panels").classList.remove("show");
    $("layers").classList.remove("on");
    prefs.follow = true; $("follow").classList.add("on");
    post({ action: "resize", w: 340, h: 340 });
    const mine = lastPlayers.find(p => p.name === me);
    if (mine && map) map.setView(toLatLng(mine.location_x, mine.location_y), MINI_ZOOM);
  } else {
    post({ action: "resize", w: 680, h: 760 });
  }
  setTimeout(() => { map && map.invalidateSize(); updateScale(); }, 120);
}
$("layers").onclick = () => setLayersOpen(!prefs.layersOpen);
function setLayersOpen(open) {
  prefs.layersOpen = open; savePrefs();
  $("panels").classList.toggle("show", open);
  $("layers").classList.toggle("on", open);
  if (open) buildGroups();
}
$("search").oninput = buildGroups;
const COLLECTED_MODES = ["show", "fade", "hide"];
$("collected").onclick = () => {
  const i = COLLECTED_MODES.indexOf(prefs.collectedMode);
  prefs.collectedMode = COLLECTED_MODES[(i + 1) % COLLECTED_MODES.length];
  savePrefs(); updateCollectedBtn(); renderTypes();
};
$("autoCol").onclick = () => {
  prefs.autoCollect = !prefs.autoCollect; savePrefs();
  $("autoCol").textContent = `Auto-mark: ${prefs.autoCollect ? "on" : "off"}`;
  $("autoCol").classList.toggle("on", prefs.autoCollect);
};
$("pReset").onclick = () => {
  if (!collected.size) return;
  collected.clear(); saveCollected(); renderTypes(); updateCollectedBtn();
};
$("pDg").onclick = () => { enabled = new Set(DEFAULT_ON); prefs.enabled = [...enabled];
  savePrefs(); renderTypes(); buildGroups(); };
$("pNone").onclick = () => { enabled = new Set(); prefs.enabled = [];
  savePrefs(); renderTypes(); buildGroups(); };
$("op").oninput = e => { prefs.opacity = +e.target.value; savePrefs();
  $("map").style.opacity = prefs.opacity / 100; };

// ---- Alt + right-drag to move, Alt+Shift+right-drag to resize ------------
(() => {
  let mode = null, w0 = 0, h0 = 0;
  addEventListener("contextmenu", e => { if (e.altKey) e.preventDefault(); }, true);
  addEventListener("mousedown", e => {
    if (e.button !== 2 || !e.altKey) return;
    e.preventDefault(); e.stopPropagation();
    mode = e.shiftKey ? "resize" : "move";
    w0 = innerWidth; h0 = innerHeight;
    document.body.style.cursor = mode === "move" ? "grabbing" : "nwse-resize";
  }, true);
  addEventListener("mousemove", e => {
    if (!mode) return;
    e.preventDefault();
    // movementX/Y are raw pointer deltas, so they stay correct even though the
    // window itself is moving underneath the cursor.
    if (mode === "move") post({ action: "drag", dx: e.movementX, dy: e.movementY });
    else { w0 += e.movementX; h0 += e.movementY;
           post({ action: "resize", w: Math.round(w0), h: Math.round(h0) }); }
  }, true);
  addEventListener("mouseup", e => {
    if (!mode) return;
    if (mode === "move") post({ action: "dragEnd" });
    mode = null; document.body.style.cursor = "";
  }, true);
})();

// ---- drag the corner grip to resize -------------------------------------
(() => {
  let on = false, w = 0, h = 0;
  $("grip").addEventListener("mousedown", e => {
    e.preventDefault(); e.stopPropagation();
    on = true; w = innerWidth; h = innerHeight;
    document.body.style.cursor = "nwse-resize";
  }, true);
  addEventListener("mousemove", e => {
    if (!on) return;
    e.preventDefault();
    w += e.movementX; h += e.movementY;
    post({ action: "resize", w: Math.max(320, Math.round(w)),
                             h: Math.max(260, Math.round(h)) });
  }, true);
  addEventListener("mouseup", () => {
    if (!on) return;
    on = false; document.body.style.cursor = "";
  }, true);
})();

// ---- boot ---------------------------------------------------------------
(async () => {
  MAPS = await (await fetch("data/maps.json")).json();
  FILTERS = await (await fetch("data/filters.json")).json();
  for (const g of FILTERS) for (const v of g.values) TYPEMETA[v.id] = v;
  // node sets load on demand - there are 164 maps and preloading them all
  // would pull several MB before the first frame

  $("follow").classList.toggle("on", prefs.follow);
  $("op").value = prefs.opacity;
  $("map").style.opacity = prefs.opacity / 100;

  await buildMap(MAPS.default ? "default" : Object.keys(MAPS)[0]);
  await setMode(prefs.mapMode);
  if (prefs.mini) setMini(true);
  // Guard against stranded geometry: the full toolbar needs room, so if we
  // somehow start small without being in mini mode, grow back to a usable size.
  else if (innerWidth < 560 || innerHeight < 420)
    post({ action: "resize", w: 680, h: 760 });
  updateCollectedBtn();
  $("autoCol").textContent = `Auto-mark: ${prefs.autoCollect ? "on" : "off"}`;
  $("autoCol").classList.toggle("on", prefs.autoCollect);
  if (prefs.layersOpen || location.hash === "#layers") setLayersOpen(true);
  await tick();
  tickStatus();
  setInterval(tickStatus, 5000);
  let cfg = {};
  try { cfg = await (await fetch("/api/config")).json(); } catch { /* defaults */ }
  setInterval(tick, Math.max(400, cfg.poll_ms || 1000));
})();
</script>
